services:
  # PostgreSQL Database for Edge Server
  edge-postgres:
    image: postgres:15-alpine
    container_name: maritime-edge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EDGE_POSTGRES_DB:-maritime_edge}
      POSTGRES_USER: ${EDGE_POSTGRES_USER:-edge_user}
      POSTGRES_PASSWORD: ${EDGE_POSTGRES_PASSWORD:?EDGE_POSTGRES_PASSWORD must be set}
    ports:
      - "${EDGE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - edge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDGE_POSTGRES_USER:-edge_user} -d ${EDGE_POSTGRES_DB:-maritime_edge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge-network

  # Edge Backend API
  backend:
    build:
      context: ..
      dockerfile: edge-services/Dockerfile
    container_name: maritime-edge-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__AutoMigrate=true
      - DataProtection__EncryptionKey=${EDGE_DATA_PROTECTION_KEY:?EDGE_DATA_PROTECTION_KEY must be set}
      - DocumentConversion__GotenbergUrl=http://gotenberg:3000
      - Database__ConnectionString=Host=edge-postgres;Port=5432;Database=${EDGE_POSTGRES_DB:-maritime_edge};Username=${EDGE_POSTGRES_USER:-edge_user};Password=${EDGE_POSTGRES_PASSWORD:?EDGE_POSTGRES_PASSWORD must be set}
      - Auth__TokenSigningKey=${EDGE_AUTH_TOKEN_SIGNING_KEY:-local_edge_token_signing_key_change_me_32_chars}
      - Security__EnforceHttps=${EDGE_SECURITY_ENFORCE_HTTPS:-false}
      - Security__RequireInternalAccess=${EDGE_SECURITY_REQUIRE_INTERNAL_ACCESS:-false}
      - InternalAccess__ApiKey=${EDGE_INTERNAL_API_KEY:-local-edge-internal-api-key}
      - SyncSecurity__Enabled=${EDGE_SYNC_SECURITY_ENABLED:-false}
      - SyncSecurity__ProtocolVersion=${EDGE_SYNC_PROTOCOL_VERSION:-2}
      - SyncSecurity__NodeId=${EDGE_SYNC_NODE_ID:-}
      - SyncSecurity__SigningKey=${EDGE_SYNC_SIGNING_KEY:-}
      - SyncSecurity__KeyVersion=${EDGE_SYNC_KEY_VERSION:-1}
      - Sync__DailyByteBudgets__Satellite_Iridium=${EDGE_IRIDIUM_DAILY_BYTES:-0}
      - Sync__DailyByteBudgets__Satellite_VSAT=${EDGE_VSAT_DAILY_BYTES:-0}
      - Sync__MaxChunksPerCycle=${EDGE_SYNC_CHUNKS_PER_CYCLE:-1}
      - Sync__MaxFilesPerCycle=${EDGE_SYNC_FILES_PER_CYCLE:-1}
    depends_on:
      edge-postgres:
        condition: service_healthy
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
      - edge-logs:/app/logs
      - edge-uploads:/app/uploads
    networks:
      - edge-network
    # Serial port mapping (uncomment for production on Linux)
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyUSB1:/dev/ttyUSB1

  frontend:
    build:
      context: ..
      dockerfile: frontend-edge/Dockerfile
    container_name: maritime-edge-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${EDGE_INTERNAL_API_KEY:-local-edge-internal-api-key}
    ports:
      - "${EDGE_HTTP_PORT:-3002}:80"
    volumes:
      - edge-uploads:/app/uploads:ro
    depends_on:
      - backend
    networks:
      - edge-network

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: maritime-edge-gotenberg
    restart: unless-stopped
    networks:
      - edge-network

  # pgAdmin (Optional - web UI for edge-postgres)
  edge-pgadmin:
    image: dpage/pgadmin4
    container_name: maritime-edge-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${EDGE_PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${EDGE_PGADMIN_PASSWORD:?EDGE_PGADMIN_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${EDGE_PGADMIN_PORT:-5050}:80"
    volumes:
      - edge-pgadmin-data:/var/lib/pgadmin
    depends_on:
      - edge-postgres
    networks:
      - edge-network

volumes:
  edge-uploads:
  edge-postgres-data:
    driver: local
  edge-logs:
    driver: local
  edge-pgadmin-data:
    driver: local

networks:
  edge-network:
    driver: bridge
