# =============================================================
# SHORE LOCAL DEVELOPMENT - docker-compose.yml
# Usage:
#   cd shore_product
#   docker compose up -d --build
#
# Services:
#   postgres  â†’ localhost:5434
#   backend   â†’ http://localhost:5001
#   frontend  â†’ http://localhost:3000
# =============================================================

services:
  # â”€â”€â”€ PostgreSQL Database â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres.local
    image: maritime-shore-postgres-local:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-product}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in shore_product/.env}
      POSTGRES_DB: ${POSTGRES_DB:-productdb}
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-product} -d ${POSTGRES_DB:-productdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shore-local-net

  # â”€â”€â”€ Shore Backend API (.NET 8) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__AutoMigrate: "true"
      Shore__PublicBaseUrl: "${SHORE_PUBLIC_BASE_URL:-http://host.docker.internal:5000}"
      DocumentConversion__GotenbergUrl: "http://gotenberg:3000"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-productdb};Username=${POSTGRES_USER:-product};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in shore_product/.env}"
      JWT__Key: "${JWT__Key:?JWT__Key must be set in shore_product/.env}"
      JWT__Issuer: "product"
      JWT__Audience: "product-users"
      Security__EnforceHttps: "${SECURITY_ENFORCE_HTTPS:-false}"
      Security__RequireInternalAccess: "${SECURITY_REQUIRE_INTERNAL_ACCESS:-false}"
      InternalAccess__ApiKey: "${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in shore_product/.env}"
      DataProtection__EncryptionKey: "${DATA_PROTECTION__ENCRYPTION_KEY:-}"
      SyncSecurity__RequireSignedRequests: "${SYNC_REQUIRE_SIGNED_REQUESTS:-false}"
      SyncSecurity__ProtocolVersion: "${SYNC_PROTOCOL_VERSION:-2}"
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shore-local-net

  # â”€â”€â”€ Shore Frontend (React + Nginx) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in shore_product/.env}"
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shore-local-net

  # ─── pgAdmin (web UI for postgres) ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set in shore_product/.env}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in shore_product/.env}"
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - shore-local-net

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - shore-local-net

volumes:
  postgres-local-data:
  backend-uploads:
  pgadmin-data:

networks:
  shore-local-net:
    driver: bridge
