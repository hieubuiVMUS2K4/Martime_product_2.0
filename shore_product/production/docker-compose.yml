# =============================================================
# SHORE PRODUCTION — docker-compose.yml
#
# Yêu cầu:
#   1. Đổi tên .env.production → .env và điền đầy đủ secrets
#   2. Chạy build-production.ps1 để build artifacts vào production/
#   3. cd production && docker compose up -d
#
# Services:
#   postgres  → nội bộ chỉ (không expose ra host)
#   backend   → nội bộ chỉ (không expose ra host)
#   frontend  → localhost:80 (Nginx, điểm vào duy nhất)
#   pgadmin   → localhost:8081 (chỉ bật khi cần, dùng profile)
# =============================================================

services:

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      TZ:                ${TZ:-UTC}
    command: ["postgres", "-c", "timezone=${TZ:-UTC}"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Schema and migration history only; no application seed data.
      - ./init-scripts/00-shore-dump.sql:/docker-entrypoint-initdb.d/00-shore-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"
    networks:
      - shore-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ─── Backend API (.NET 8) ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}
      JWT__Key:       ${JWT_KEY}
      JWT__Issuer:    ${JWT_ISSUER:-product}
      JWT__Audience:  ${JWT_AUDIENCE:-product-users}
      Security__EnforceHttps: ${SECURITY_ENFORCE_HTTPS:-true}
      Security__RequireInternalAccess: ${SECURITY_REQUIRE_INTERNAL_ACCESS:-true}
      InternalAccess__ApiKey: ${INTERNAL_API_KEY}
      DataProtection__EncryptionKey: ${DATA_PROTECTION__ENCRYPTION_KEY}
      SyncSecurity__RequireSignedRequests: ${SYNC_REQUIRE_SIGNED_REQUESTS:-true}
      SyncSecurity__ProtocolVersion: ${SYNC_PROTOCOL_VERSION:-2}
      Groq__ApiKey: ${GROQ_API_KEY}
      Gemini__ApiKey: ${GEMINI_API_KEY}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shore-net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ─── Frontend (Nginx + React SPA) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - backend
    networks:
      - shore-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ─── pgAdmin (optional — bật khi cần: docker compose --profile tools up) ──
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    profiles: ["tools"]
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - shore-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

# ─── Volumes ───────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  uploads-data:
    driver: local

# ─── Networks ──────────────────────────────────────────────────
networks:
  shore-net:
    driver: bridge
